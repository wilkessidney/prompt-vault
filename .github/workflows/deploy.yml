name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build
        run: node scripts/build.mjs
      # 注意：这里刻意「不」把构建产物 data/ 回写仓库。
      # data/ 是真源 prompts/*.md 的派生物，双向写入（本地 build 提交 + Actions 回写）
      # 必然产生冲突。线上部署用的是本次构建的 data，不受影响；
      # 在网页端新增提示词后，本地 git pull 再跑一次 npm run build 即可同步。
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
